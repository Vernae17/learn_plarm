<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* 主容器 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部样式 - 左上角头像和用户名 */
        .header {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 50px;
            width: fit-content;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
            margin-right: 15px;
        }

        .username {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        /* 主要内容区域 */
        .main-content {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* 欢迎文字 */
        .welcome-text {
            font-size: 36px;
            color: #333;
            margin-bottom: 50px;
            font-weight: 600;
        }

        .welcome-text span {
            color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* 按钮网格 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        /* 按钮样式 */
        .nav-button {
            background: white;
            border: none;
            padding: 30px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .nav-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        /* 按钮图标 */
        .button-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* 不同按钮的悬停效果 */
        .button-1:hover { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .button-2:hover { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .button-3:hover { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .button-4:hover { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: white; }
        .button-5:hover { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .welcome-text {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <script>
    // 最简单的实现：3秒后删除所有flash消息
    setTimeout(function() {
        const container = document.getElementById('flash-container');
        if (container) {
            container.style.transition = 'opacity 0.5s';
            container.style.opacity = '0';
            setTimeout(() => container.remove(), 500);
        }
    }, 3000); // 3000毫秒 = 3秒
    </script>
    <div class="container">
        <!-- 左上角头像和用户名 -->
        <div class="header">
            <img src="{{ url_for('static', filename='uploads/avatars/' + user.avatar) if user.avatar else url_for('static', filename='uploads/avatars/default_avatar.png') }}"
                 alt="用户头像"
                 class="avatar"
                 onerror="this.src='{{ url_for('static', filename='uploads/avatars/default_avatar.png') }}'">
            <span class="username">{{ user.username }}</span>
        </div>

        <!-- 主要内容区域 -->
        <div class="main-content">
            <!-- 欢迎文字 -->
            <h1 class="welcome-text">
                欢迎回来<span>，{{ user.username }}！</span>
            </h1>

            <!-- 五个功能按钮 -->
            <div class="button-grid">
                <!-- 按钮1：个人资料 -->
                <button class="nav-button button-1" onclick="window.location.href='{{ url_for('profile.profile') }}'">
                    <span class="button-icon">👤</span>
                    <span>个人资料</span>
                </button>

                <!-- 按钮2：我的课程 -->
                <button class="nav-button button-2" onclick="window.location.href='{{ url_for('mycourse.mycourse') }}'">
                    <span class="button-icon">📚</span>
                    <span>我的课程</span>
                </button>

                <!-- 按钮3：学习分析 -->
                <button class="nav-button button-3" onclick="window.location.href='{{ url_for('analysis.analysis') }}'">
                    <span class="button-icon">📊</span>
                    <span>学习分析</span>
                </button>

                <!-- 按钮4：课程推荐 -->
                <button class="nav-button button-4" onclick="window.location.href='{{ url_for('recommendations.recommendations') }}'">
                    <span class="button-icon">🎯</span>
                    <span>个性化推荐</span>
                </button>

                <!-- 按钮5：系统设置 -->
                <button class="nav-button button-5" onclick="window.location.href='{{ url_for('settings.settings') }}'">
                    <span class="button-icon">⚙️</span>
                    <span>设置</span>
                </button>

                <!-- 按钮6：AI辅助生成 -->
                <button class="nav-button button-5" onclick="window.location.href='{{ url_for('ai_assistant.ai_assistant') }}'">
                    <span class="button-icon">🤖</span>
                    <span>AI辅助生成</span>
                </button>
            </div>
        </div>
    </div>

    <div class="">
        <form action="/logout">
            <button type="submit">退出登录</button>
        </form>
    </div>

    <!-- 浮动AI问答助手 -->
    <div id="aiChatWidget" class="ai-chat-widget">
        <div class="chat-toggle" onclick="toggleChat()">
            <i class="fas fa-robot">🤖</i>
            <span class="chat-badge">AI</span>
        </div>
        <div class="chat-container" style="display: none;">
            <div class="chat-header">
                <i class="fas fa-robot"></i> AI学习助手
                <span class="chat-close" onclick="toggleChat()">×</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content">你好！我是你的AI学习助手，有什么可以帮助你的吗？</div>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatQuestion" placeholder="输入你的问题..." rows="2"
                          onkeypress="if(event.keyCode==13 && !event.shiftKey) {event.preventDefault(); sendQuestion();}"></textarea>
                <button onclick="sendQuestion()" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 添加简单的动画效果 -->
    <script>
        // 按钮点击效果
        document.querySelectorAll('.nav-button').forEach(button => {
            button.addEventListener('click', function(e) {
                // 创建波纹效果
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);

                // 获取点击位置
                const x = e.clientX - e.target.offsetLeft;
                const y = e.clientY - e.target.offsetTop;

                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;

                // 移除波纹
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>

    <style>
        /* 按钮点击波纹效果 */
        .nav-button {
            position: relative;
            overflow: hidden;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: ripple-animation 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</body>
<style>
/* 浮动AI助手样式 */
.ai-chat-widget {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 1000;
}

.chat-toggle {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    transition: all 0.3s ease;
    position: relative;
}

.chat-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
}

.chat-toggle i {
    font-size: 28px;
    color: white;
}

.chat-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #f56565;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: bold;
}

.chat-container {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.chat-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
}

.chat-close {
    margin-left: auto;
    cursor: pointer;
    font-size: 20px;
    opacity: 0.8;
}

.chat-close:hover {
    opacity: 1;
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f7fafc;
}

.message {
    margin-bottom: 15px;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.message.user .message-content {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 18px 18px 4px 18px;
}

.message.bot .message-content {
    background: white;
    color: #2d3748;
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}

.message-content {
    max-width: 80%;
    padding: 10px 15px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
}

.chat-input-area {
    padding: 15px;
    background: white;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 10px;
}

.chat-input-area textarea {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    resize: none;
    font-family: inherit;
}

.chat-input-area textarea:focus {
    outline: none;
    border-color: #667eea;
}

.send-btn {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
}

.send-btn:hover {
    transform: scale(1.05);
}
</style>

<script>
// 聊天功能
function toggleChat() {
    const container = document.querySelector('.chat-container');
    if (container.style.display === 'none') {
        container.style.display = 'flex';
    } else {
        container.style.display = 'none';
    }
}

function sendQuestion() {
    const questionInput = document.getElementById('chatQuestion');
    const question = questionInput.value.trim();

    if (!question) return;

    // 添加用户消息
    addMessage(question, 'user');
    questionInput.value = '';

    // 显示加载状态
    const loadingMsg = addMessage('思考中...', 'bot', true);

    fetch('/api/ai_ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
    })
    .then(res => res.json())
    .then(data => {
        // 移除加载消息
        loadingMsg.remove();

        if (data.success) {
            addMessage(data.answer, 'bot');
        } else {
            addMessage('抱歉，处理失败：' + (data.error || '未知错误'), 'bot');
        }
    })
    .catch(error => {
        loadingMsg.remove();
        addMessage('网络错误，请稍后重试', 'bot');
    });
}

function addMessage(content, sender, isLoading = false) {
    const container = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'message-content';

    if (isLoading) {
        contentDiv.innerHTML = '<span class="loading"></span> 思考中...';
    } else {
        contentDiv.innerHTML = content.replace(/\n/g, '<br>');
    }

    messageDiv.appendChild(contentDiv);
    container.appendChild(messageDiv);
    container.scrollTop = container.scrollHeight;

    return messageDiv;
}
</script>
</html>
