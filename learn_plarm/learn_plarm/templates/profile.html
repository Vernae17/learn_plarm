<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>学习行为分析平台-个人信息</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.0.0/css/all.css">
</head>
<body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Microsoft YaHei', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    /* 渐变背景动画 */
    .dynamic-bg {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
        z-index: -2;
    }

    @keyframes gradient {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }

    /* 半透明遮罩层，让内容更易读 */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        z-index: -1;
    }
    .info-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f8fafc;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

    .info-label {
            width: 100px;
            color: #666;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

</style>
<h2 style="background-color: lightblue">个人资料</h2>
<div class="dynamic-bg" id="bg-animation"></div>
<div style="center;">
    <img src="{{ url_for('static', filename='uploads/avatars/' + user.avatar) if user.avatar else 'https://via.placeholder.com/60' }}"
         alt="头像" class="avater" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #667eea;">
    <h3 style="margin: 15px 0 5px;">{{ user.username }}</h3>
    <!--<p style="color: #666;">{{ user.email or '未设置邮箱' }}</p>-->
</div>

<div style="border-top: 1px soild #eea; padding-top: 20px;">
    <p class="info-item"><i class="fas fa-user"></i><strong class="info-label">用户名：</strong>{{ user.username }}</p>
    <p class="info-item"><i class="fas fa-envelope"></i><strong class="info-label">邮箱：</strong>{{ user.email or '未设置邮箱' }}</p>
    <p class="info-item"><i class="fas fa-calendar"></i><strong class="info-label">注册时间：</strong>{{ user.created_at }}</p>
</div>


</body>
</html>
